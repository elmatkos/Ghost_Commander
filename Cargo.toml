[workspace]
resolver = "2"
members = ["crates/gc-core", "crates/gc-archive", "crates/gc-sysinfo", "crates/gc-ftp", "crates/gc-dism", "crates/gc-app"]

[workspace.package]
version = "0.31.0"
authors = ["Martin Balaj"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/elmatkos/Ghost_Commander"
edition = "2021"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
