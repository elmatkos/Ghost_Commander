[package]
name = "gc-core"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
trash = "5"
crc32fast = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_System_WindowsProgramming"] }
