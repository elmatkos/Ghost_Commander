[package]
name = "gc-app"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "ghost-commander"
path = "src/main.rs"

[dependencies]
gc-core = { path = "../gc-core" }
eframe = "0.31"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"
egui-phosphor = "0.9"
serde = { version = "1", features = ["derive"] }
gc-archive = { version = "0.0.1", path = "../gc-archive" }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
